[package]
name = "build"
version = "0.1.0"
edition.workspace = true

# `build` is a reserved binary target name; the package keeps the name so
# `cargo run -p build` works.
[[bin]]
name = "build-site"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
flate2.workspace = true
serde.workspace = true
serde_yaml.workspace = true
pulldown-cmark.workspace = true
tera.workspace = true
chrono.workspace = true
serde_json.workspace = true
