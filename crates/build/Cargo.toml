[package]
name = "build"
version = "0.1.0"
edition.workspace = true

# `build` is a reserved binary target name; the package keeps the name so
# `cargo run -p build` works.
[[bin]]
name = "build-site"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
flate2.workspace = true
serde.workspace = true
serde_yaml.workspace = true
pulldown-cmark.workspace = true
tera.workspace = true
chrono.workspace = true
serde_json.workspace = true
fastembed.workspace = true
image.workspace = true
libwebp-sys.workspace = true
sha2.workspace = true
jpeg-encoder.workspace = true
ureq.workspace = true
avif-parse.workspace = true
rav1d.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile = "3"

[lib]
name = "postcms_build"
path = "src/lib.rs"

[[bin]]
name = "pt-render"
path = "src/bin/pt_render.rs"
