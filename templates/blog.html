{% extends "base.html" %}
{% block title %}Blog — {{ site_title }}{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold text-heading leading-tight">Blog</h1>
<ul class="list-none p-0 mt-8 space-y-6">
  {% for post in posts %}
  <li>
    <a href="{{ root | safe }}/posts/{{ post.slug }}/" class="text-accent no-underline font-medium">{{ post.title }}</a>
    <span class="text-faint text-sm"> · {{ post.date }}</span>
    {% if post.description %}<p class="text-muted text-sm mt-1 mb-0">{{ post.description }}</p>{% endif %}
  </li>
  {% endfor %}
</ul>
{% endblock %}
