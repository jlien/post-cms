{% extends "base.html" %}
{% block title %}{{ title }} — Post-CMS{% endblock %}
{% block content %}
<article>
  <h1 class="text-3xl font-bold text-heading leading-tight">{{ title }}</h1>
  <p class="text-muted text-sm mb-8 mt-2">
    {{ date }} · lang: {{ lang }}
    <span>{% for tag in tags %}<span class="inline-block bg-card border border-line rounded-full px-2.5 text-xs text-muted mr-1.5">{{ tag }}</span>{% endfor %}</span>
  </p>
  <div class="prose">{{ body | safe }}</div>
</article>
{% endblock %}
