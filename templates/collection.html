{% extends "base.html" %}
{% block title %}{{ coll_title }} — Post-CMS{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold text-heading leading-tight">{{ coll_title }}</h1>
<div class="mt-8 grid gap-6">
  {% for item in items %}
  <a class="block border border-line rounded-lg p-5 bg-card hover:border-accent" href="{{ root }}/{{ coll_name }}/{{ item.slug }}/">
    <div class="text-lg font-semibold text-heading">{{ item.title }}</div>
    {% if item.description %}<p class="text-muted text-sm mt-1">{{ item.description }}</p>{% endif %}
  </a>
  {% endfor %}
</div>
{% endblock %}
