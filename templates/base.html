<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Cache-Control guidance: serve this HTML with `Cache-Control: public, max-age=0, s-maxage=86400, stale-while-revalidate=604800` -->
  <!-- css-sha256: {{ css_hash }} -->
  <title>{% block title %}Post-CMS{% endblock %}</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      line-height: 1.65;
    }
    main {
      max-width: 44rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    header.site {
      border-bottom: 1px solid #21262d;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header.site a { color: #e6edf3; text-decoration: none; font-weight: 600; }
    header.site nav a { margin-left: 1rem; font-weight: 400; color: #8b949e; }
    header.site nav a:hover { color: #e6edf3; }
    a { color: #58a6ff; }
    h1, h2, h3 { line-height: 1.25; color: #f0f6fc; }
    h1 { font-size: 1.9rem; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 4px;
      padding: 0.1em 0.35em;
      font-size: 0.9em;
    }
    pre {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
    }
    pre code { background: none; border: none; padding: 0; }
    blockquote {
      margin: 1rem 0;
      padding: 0.25rem 1rem;
      border-left: 3px solid #30363d;
      color: #8b949e;
    }
    article.meta { color: #8b949e; font-size: 0.9rem; margin-bottom: 2rem; }
    .posts { list-style: none; padding: 0; }
    .posts li { margin-bottom: 1.5rem; }
    .posts .desc { color: #8b949e; margin: 0.25rem 0 0; }
    .posts .date { color: #6e7681; font-size: 0.85rem; }
    .tags .tag {
      display: inline-block;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 999px;
      padding: 0 0.6em;
      font-size: 0.8rem;
      color: #8b949e;
      margin-right: 0.35rem;
    }
    footer.site {
      border-top: 1px solid #21262d;
      color: #6e7681;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header class="site">
    <a href="/">Post-CMS</a>
    <nav>
      <a href="/rss.xml">RSS</a>
      <a href="/sitemap.xml">Sitemap</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site">Built from git · served static · no CMS</footer>
</body>
</html>
