<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Cache-Control guidance: serve this HTML with `Cache-Control: public, max-age=0, s-maxage=86400, stale-while-revalidate=604800` -->
  <!-- css-sha256: {{ css_hash }} -->
  <title>{% block title %}Post-CMS{% endblock %}</title>
  <style>{{ style | safe }}</style>
</head>
<body class="min-h-screen bg-bg text-fg font-sans leading-relaxed">
  <header class="border-b border-line px-5 py-4 flex justify-between items-center">
    <a href="/" class="text-fg no-underline font-semibold">Post-CMS</a>
    <nav class="text-sm">
      <a href="/rss.xml" class="text-muted hover:text-fg no-underline ml-4">RSS</a>
      <a href="/sitemap.xml" class="text-muted hover:text-fg no-underline ml-4">Sitemap</a>
    </nav>
  </header>
  <main class="max-w-2xl mx-auto px-5 pt-10 pb-16">
    {% block content %}{% endblock %}
  </main>
  <footer class="border-t border-line text-muted text-center px-5 py-6 text-sm">Built from git · served static · no CMS</footer>
</body>
</html>
