{% extends "base.html" %}
{% block title %}Post-CMS{% endblock %}
{% block content %}
<h1>Latest posts</h1>
<ul class="posts">
  {% for post in posts %}
  <li>
    <a href="/posts/{{ post.slug }}">{{ post.title }}</a>
    <span class="date">· {{ post.date }}</span>
    <p class="desc">{{ post.description }}</p>
  </li>
  {% endfor %}
</ul>
{% endblock %}
