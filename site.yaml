# Site-level config. `theme` names a directory under themes/.
theme: astra
title: Post-CMS
tagline: A git-based publishing stack — posts live in markdown, the build is a Rust crate, and no platform sits in between.
contact_email: hello@example.com

plugins:
  - name: hubspot-form
    mounts: [body_end]
    csp_script_src: ["js.hsforms.net", "js.hs-scripts.com"]
    # Product call (pass 5, item 2): the form is NOT consent-gated — gating
    # the contact form itself costs conversions. Consent-gate tracking
    # plugins only (they set require_consent: true and get the banner).
    require_consent: false
    # per-page component: only dist/contact/, inside the template's slot
    pages: [contact]
    anchor: contact-form

# llms.txt header (all keys optional; title defaults to `title`, summary to
# `tagline`). `mcp: false` drops the MCP Servers section.
llms:
  summary: "A git-based publishing stack: content as files, static Rust build, no CMS. This file is a machine-readable index of all published posts."

# robots.txt (all keys optional). Defaults: allow [/], no disallow, sitemap
# line on, no extra lines.
# robots:
#   disallow: [/preview/]
#   extra: ["User-agent: ExampleBot", "Disallow: /"]
