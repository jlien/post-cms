[workspace]
resolver = "2"
members = ["crates/build", "crates/server"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
pulldown-cmark = "0.13"
tera = "1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
flate2 = "1"
