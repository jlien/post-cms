[workspace]
resolver = "2"
members = ["crates/build", "crates/server"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
pulldown-cmark = "0.13"
tera = "1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
flate2 = "1"
fastembed = "5"
ureq = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "avif"] }
webp = { version = "0.3", default-features = false }
libwebp-sys = "0.9"
sha2 = "0.10"
jpeg-encoder = "0.7"
# AVIF sources: pure Rust container parser and AV1 decoder (no asm, no system lib)
avif-parse = "2.1"
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
libc = "0.2"
